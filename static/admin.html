<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员控制台</title>
  <style>
    /* --- 1. 现代化色彩与变量定义 --- */
    :root {
      --bg: #0f172a;
      /* 更深邃的背景 */
      --panel: #1e293b;
      /* 面板颜色 */
      --card: #1e293b;
      --text: #f8fafc;
      /* 主文本色 */
      --muted: #94a3b8;
      /* 次要文本色 */
      --primary: #3b82f6;
      /* 主色调蓝 */
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --border: #334155;
      --input-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antiali;
    }

    /* --- 2. 顶部导航栏 --- */
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    nav {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    nav a:hover,
    nav a.active {
      color: var(--text);
    }

    .logout-btn {
      background: var(--danger);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
    }

    .logout-btn:hover {
      background: var(--danger-hover);
    }

    /* --- 3. 布局与卡片 --- */
    main {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 24px 64px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 1024px) {

      /* 左侧偏窄（操作区），右侧偏宽（数据区） */
      .layout-grid {
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 24px;
        align-items: start;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
    }

    .card-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .card-body {
      padding: 20px;
    }

    /* --- 4. 表单与按钮 --- */
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    input,
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
    }

    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button.primary {
      background: var(--primary);
      color: white;
      width: 100%;
    }

    button.primary:hover {
      background: var(--primary-hover);
    }

    /* 次要按钮（如刷新、表格内操作） */
    button.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      font-size: 12px;
    }

    button.ghost:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    button.ghost.danger:hover {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border-color: var(--danger);
    }

    /* --- 5. 状态展示区 (邀请码生成结果) --- */
    .result-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      display: none;
      /* 默认隐藏 */
    }

    .result-box.show {
      display: block;
    }

    .code-display {
      font-family: monospace;
      font-size: 18px;
      color: var(--success);
      margin: 8px 0;
      word-break: break-all;
    }

    /* --- 6. 表格样式 --- */
    .table-responsive {
      overflow-x: auto;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th,
    td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    th:first-child,
    td:first-child {
      padding-left: 24px;
    }

    th:last-child,
    td:last-child {
      padding-right: 24px;
    }

    th {
      color: var(--muted);
      font-weight: 500;
      background: rgba(0, 0, 0, 0.15);
      white-space: nowrap;
    }

    tbody tr {
      transition: background-color 0.2s;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* --- 7. 标签 (Pill) --- */
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid transparent;
    }

    .pill.admin {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.2);
    }

    .pill.user {
      background: rgba(148, 163, 184, 0.1);
      color: var(--muted);
      border-color: rgba(148, 163, 184, 0.2);
    }

    /* --- 8. 全局 Toast 提示 --- */
    #toast-container {
      position: fixed;
      top: 80px;
      right: 32px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideIn 0.3s ease forwards;
    }

    .toast.success {
      border-left: 4px solid var(--success);
    }

    .toast.error {
      border-left: 4px solid var(--danger);
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .empty-state {
      padding: 32px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <h1>管理控制台 (Admin)</h1>
    <nav>
      <a href="/index.html" id="nav-home">前台首页</a>
      <a href="/analyze.html">识别页面</a>
      <a class="logout-btn" onclick="logout()">退出登录</a>
    </nav>
  </header>

  <main class="layout-grid">
    <!-- 顶部全宽卡片：果园总览热力图 -->
    <div class="card" style="grid-column: 1 / -1;">
      <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h2>园区监测大屏 (环境热力雷达)</h2>
        <div id="orchardLegend" style="display: flex; gap: 16px; font-size: 13px; color: var(--muted);"></div>
      </div>
      <div class="card-body" style="padding: 0;">
        <canvas id="orchardMap" width="1150" height="320" style="width: 100%; height: 320px; background: #0f172a; display: block;"></canvas>
      </div>
    </div>

    <!-- 左侧：操作区 -->
    <div class="left-panel">
      <div class="card">
        <div class="card-header">
          <h2>生成邀请码</h2>
        </div>
        <div class="card-body">
          <label>设置有效期</label>
          <select id="ttlSelect" style="margin-bottom: 16px;">
            <option value="3600">1 小时</option>
            <option value="86400" selected>1 天 (24小时)</option>
            <option value="604800">7 天</option>
            <option value="2592000">30 天</option>
            <option value="0">永久有效</option>
          </select>
          <button class="primary" id="btnCreateInvite">立即生成</button>

          <div class="result-box" id="inviteResult">
            <div style="font-size: 12px; color: var(--muted);">邀请码生成成功：</div>
            <div class="code-display" id="generatedCode"></div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;">
              <span style="font-size: 12px; color: var(--muted);" id="generatedExpire"></span>
              <button class="ghost" onclick="copyInviteCode()">复制代码</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧：数据展示与管理区 -->
    <div class="right-panel grid">

      <!-- 待审批列表 -->
      <div class="card">
        <div class="card-header">
          <h2>待审批申请</h2>
          <button class="ghost" id="btnListPending">刷新</button>
        </div>
        <div class="card-body" style="padding: 0;">
          <div class="table-responsive" id="pendingWrap"></div>
        </div>
      </div>

      <!-- 用户管理 -->
      <div class="card">
        <div class="card-header">
          <h2>用户管理</h2>
          <button class="ghost" id="btnListUsers">刷新</button>
        </div>
        <div class="card-body" style="padding: 0;">
          <div class="table-responsive" id="usersWrap"></div>
        </div>
      </div>

      <!-- 邀请码列表 -->
      <div class="card">
        <div class="card-header">
          <h2>历史邀请码</h2>
          <button class="ghost" id="btnListInvites">刷新</button>
        </div>
        <div class="card-body" style="padding: 0;">
          <div class="table-responsive" id="invitesWrap"></div>
        </div>
      </div>

    </div>
  </main>

  <div id="toast-container"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const SESSION_COOKIE = "session_token";

    // --- 核心工具函数 ---
    function showToast(message, type = 'success') {
      const container = $('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
    
    function copyText(text) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast('邀请码已复制到剪贴板');
      }).catch(() => {
        showToast('复制失败，请手动选择复制', 'error');
      });
    }

    function formatDate(unixSeconds) {
      if (!unixSeconds || unixSeconds <= 0) return "永久有效";
      const d = new Date(unixSeconds * 1000);
      return isNaN(d.getTime()) ? "未知时间" : d.toLocaleString();
    }

    function copyInviteCode() {
      const code = $('generatedCode').innerText;
      if (!code) return;
      navigator.clipboard.writeText(code).then(() => {
        showToast('邀请码已复制到剪贴板');
      }).catch(() => {
        showToast('复制失败，请手动选择复制', 'error');
      });
    }

    function logout() {
      document.cookie = `${SESSION_COOKIE}=; path=/; max-age=0; samesite=lax`;
      setTimeout(() => location.reload(), 80);
    }

    // --- 网络请求逻辑 ---
    function getCookie(name) {
      const prefix = `${name}=`;
      const part = document.cookie.split(";").map((item) => item.trim()).find((item) => item.startsWith(prefix));
      if (!part) return "";
      return decodeURIComponent(part.slice(prefix.length));
    }

    function getToken() { return getCookie(SESSION_COOKIE); }

    function requestHeaders(withJsonBody) {
      const headers = {};
      if (withJsonBody) headers["Content-Type"] = "application/json";
      const token = getToken();
      if (token) headers["X-Session-Token"] = token;
      return headers;
    }

    async function postJson(url, body) {
      const withBody = body !== undefined;
      try {
        const res = await fetch(url, {
          method: "POST",
          credentials: "same-origin",
          headers: requestHeaders(withBody),
          body: withBody ? JSON.stringify(body) : undefined,
        });
        const text = await res.text();
        try { return { ok: res.ok, data: JSON.parse(text) }; }
        catch { return { ok: res.ok, data: { raw: text } }; }
      } catch (e) {
        return { ok: false, data: { error: "网络请求失败" } };
      }
    }

    async function validateAdmin() {
      const token = getToken();
      if (!token) return false;
      const resp = await postJson("/user/validate");
      return resp.ok && resp.data.valid && resp.data.is_admin;
    }

    // --- 业务逻辑 ---
    async function createInvite() {
      const btn = $('btnCreateInvite');
      btn.disabled = true;
      btn.innerText = "生成中...";

      const ttlVal = Number($("ttlSelect").value);
      const body = ttlVal > 0 ? { ttl_seconds: ttlVal } : {};

      const resp = await postJson("/user/admin/invitations/create", body);
      btn.disabled = false;
      btn.innerText = "立即生成";

      if (!resp.ok) {
        showToast(resp.data.error || "生成失败", "error");
      } else {
        showToast("邀请码生成成功");
        $('inviteResult').classList.add('show');
        $('generatedCode').innerText = resp.data.code;
        $('generatedExpire').innerText = "过期于: " + formatDate(resp.data.expires_at);
        listInvites();
      }
    }

    async function toggleAdmin(username, currentIsAdmin) {
      if (!confirm(`确定要将 ${username} ${currentIsAdmin ? '降级为普通用户' : '设为管理员'} 吗？`)) return;

      const resp = await postJson("/user/admin/set_admin", {
        target_username: username,
        make_admin: !currentIsAdmin,
      });

      if (!resp.ok) {
        showToast(resp.data.error || "权限更新失败", "error");
      } else {
        showToast(`已成功更新 ${username} 的权限`);
        listUsers();
      }
    }

    function renderInvites(list) {
      if (!list || list.length === 0) {
        $("invitesWrap").innerHTML = "<div class='empty-state'>暂无历史邀请码数据</div>";
        return;
      }
      const rows = list.map(i => `
          <tr>
            <td style="font-family: monospace; letter-spacing: 0.5px;">${i.code}</td>
            <td>${i.used ? "<span class='pill user'>已使用</span>" : "<span class='pill admin'>可用</span>"}</td>
            <td>${formatDate(i.expires_at)}</td>
            <td>
              <button class="ghost" onclick="copyText('${i.code}')">复制</button>
            </td>
          </tr>
        `).join("");

      $("invitesWrap").innerHTML = `
          <table>
            <thead>
              <tr>
                <th>邀请码</th>
                <th>状态</th>
                <th>过期时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;
    }

    function renderUsers(list) {
      if (!list || list.length === 0) {
        $("usersWrap").innerHTML = "<div class='empty-state'>暂无用户数据</div>";
        return;
      }
      const rows = list.map(u => {
        const safeUsername = encodeURIComponent(u.username);
        const actionBtn = u.is_admin
          ? `<button class="ghost danger" onclick="toggleAdmin(decodeURIComponent('${safeUsername}'), true)">撤销管理</button>`
          : `<button class="ghost" onclick="toggleAdmin(decodeURIComponent('${safeUsername}'), false)">设为管理</button>`;

        return `
          <tr>
            <td>${u.username}</td>
            <td>${u.is_admin ? "<span class='pill admin'>管理员</span>" : "<span class='pill user'>普通用户</span>"}</td>
            <td>${formatDate(u.created_at)}</td>
            <td>${actionBtn}</td>
          </tr>
        `}).join("");

      $("usersWrap").innerHTML = `<table><thead><tr><th>用户名</th><th>身份</th><th>注册时间</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function renderPending(list) {
      if (!list || list.length === 0) {
        $("pendingWrap").innerHTML = "<div class='empty-state'>当前没有需要审批的请求</div>";
        return;
      }
      const rows = list.map((u) => {
        const role = u.requested_role === "admin" ? "<span class='pill admin'>管理员申请</span>" : "<span class='pill user'>普通用户</span>";
        const encoded = encodeURIComponent(u.username);
        return `
            <tr>
              <td>${u.username}</td>
              <td>${role}</td>
              <td>${formatDate(u.created_at)}</td>
              <td>
                <button class="ghost" style="color:var(--success); border-color:var(--success);" onclick="approvePending(decodeURIComponent('${encoded}'))">通过</button>
                <button class="ghost danger" onclick="rejectPending(decodeURIComponent('${encoded}'))">拒绝</button>
              </td>
            </tr>`;
      }).join("");
      $("pendingWrap").innerHTML = `<table><thead><tr><th>申请人</th><th>期望身份</th><th>申请时间</th><th>审批操作</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    async function listPending() {
      const resp = await postJson("/user/admin/pending/list");
      if (resp.ok) renderPending(resp.data.pending_users ||[]);
      else showToast("获取待审批列表失败", "error");
    }

    async function listInvites() {
      const resp = await postJson("/user/admin/invitations/list");
      if (resp.ok) renderInvites(resp.data.invitations ||[]);
      else showToast("获取邀请码列表失败", "error");
    }

    async function listUsers() {
      const resp = await postJson("/user/admin/users/list");
      if (resp.ok) renderUsers(resp.data.users ||[]);
      else showToast("获取用户列表失败", "error");
    }

    async function approvePending(username) {
      const resp = await postJson("/user/admin/pending/approve", { username });
      if (resp.ok) { showToast(`已通过 ${username} 的申请`); listPending(); listUsers(); }
      else showToast(resp.data.error || "操作失败", "error");
    }

    async function rejectPending(username) {
      if (!confirm(`确定要拒绝 ${username} 的申请吗？`)) return;
      const resp = await postJson("/user/admin/pending/reject", { username });
      if (resp.ok) { showToast(`已拒绝 ${username} 的申请`); listPending(); }
      else showToast(resp.data.error || "操作失败", "error");
    }

    let seed = 20260309;
    function seededRandom() {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280.0;
    }

    // --- 全新优化的雷达扫描风果园地图绘制 ---
    function renderOrchardMap() {
      const dataCounts =[
        { label: "健康果树", count: 300, color: "#10b981" },
        { label: "黄龙病预警", count: 18, color: "#ef4444" },
        { label: "溃疡病预警", count: 15, color: "#f59e0b" },
        { label: "沙皮病预警", count: 12, color: "#8b5cf6" }
      ];

      // 图例升级：加入辉光，颜色高亮
      const legend = $('orchardLegend');
      if (legend) {
        legend.innerHTML = dataCounts.map(d => `
          <div style="display: flex; align-items: center; gap: 6px;">
            <div style="width: 10px; height: 10px; border-radius: 50%; background: ${d.color}; box-shadow: 0 0 8px ${d.color};"></div>
            <span>${d.label} <strong style="color:var(--text)">${d.count}</strong></span>
          </div>
        `).join("");
      }

      const canvas = $('orchardMap');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      
      // 每次绘制前重置种子
      seed = 987654321; 

      // --- 1. 使用 FBM 生成自然起伏的科技感背景 ---
      // 2D Hash 函数
      function hash(x, y) {
        const dot = x * 12.9898 + y * 78.233;
        const sin = Math.sin(dot) * 43758.5453;
        return sin - Math.floor(sin);
      }

      // Smoothstep 2D Value Noise
      function vnoise(x, y) {
        const i = Math.floor(x);
        const j = Math.floor(y);
        const f_x = x - i;
        const f_y = y - j;
        
        const u = f_x * f_x * (3.0 - 2.0 * f_x);
        const v = f_y * f_y * (3.0 - 2.0 * f_y);

        const n00 = hash(i, j);
        const n10 = hash(i + 1.0, j);
        const n01 = hash(i, j + 1.0);
        const n11 = hash(i + 1.0, j + 1.0);

        const nx0 = n00 + u * (n10 - n00);
        const nx1 = n01 + u * (n11 - n01);

        return nx0 + v * (nx1 - nx0);
      }

      // FBM叠加，形成无规律自然地形
      function fbm(x, y) {
        let val = 0.0;
        let amp = 0.5;
        let freq = 1.0;
        let maxVal = 0.0;
        for (let i = 0; i < 4; i++) {
          val += amp * vnoise(x * freq, y * freq);
          maxVal += amp;
          freq *= 2.0;
          amp *= 0.5;
        }
        return val / maxVal; // 归一化到 0.0 ~ 1.0
      }

      // 替换生硬的地形配色，改为适应背景色的深层暗科技色系
      const topoColors = [
        [15, 23, 42],   // 最底层水系/凹陷区
        [18, 28, 50],[21, 34, 57],
        [24, 40, 62],[28, 48, 65],[32, 56, 65],
        [36, 64, 62]    // 偏青色的最高处
      ];
      const levels = topoColors.length;

      // 使用3x3的方块渲染既有像素网格的美感，又极大提高了加载速度
      const blockSize = 3; 
      const cols = Math.ceil(W / blockSize);
      const rows = Math.ceil(H / blockSize);
      const scale = 0.015; // 控制起伏密集度

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const val = fbm(x * blockSize * scale, y * blockSize * scale);
          
          let levelIdx = Math.floor(val * levels);
          if (levelIdx >= levels) levelIdx = levels - 1;
          if (levelIdx < 0) levelIdx = 0;

          let[r, g, b] = topoColors[levelIdx];
          
          // 给等高线边缘加上微光特效
          const isEdge = (val * levels) % 1 < 0.15;
          if (isEdge) {
            r = Math.min(255, r + 15);
            g = Math.min(255, g + 25);
            b = Math.min(255, b + 35);
          }

          ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
          ctx.fillRect(x * blockSize, y * blockSize, blockSize, blockSize);
        }
      }

      // --- 2. 绘制网格线与雷达探测角 ---
      ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= W; i += 40) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke();
      }
      for (let j = 0; j <= H; j += 40) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(W, j); ctx.stroke();
      }

      // 四个角的瞄准框装饰
      ctx.strokeStyle = "rgba(59, 130, 246, 0.6)";
      ctx.lineWidth = 2;
      const len = 16;
      ctx.beginPath(); ctx.moveTo(0, len); ctx.lineTo(0, 0); ctx.lineTo(len, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W - len, 0); ctx.lineTo(W, 0); ctx.lineTo(W, len); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, H - len); ctx.lineTo(0, H); ctx.lineTo(len, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W - len, H); ctx.lineTo(W, H); ctx.lineTo(W, H - len); ctx.stroke();

      // --- 3. 绘制带有光晕和阴影的传感器指示灯 ---
      const centers =[];
      for(let i=0; i<4; i++) {
        centers.push({
          x: seededRandom() * W,
          y: seededRandom() * H,
          type: seededRandom() > 0.6 ? 1 : (seededRandom() > 0.5 ? 2 : 3)
        });
      }

      dataCounts.forEach((category, cIdx) => {
        for (let i = 0; i < category.count; i++) {
          let x, y;
          if (cIdx === 0) {
            // 健康树全局离散
            x = seededRandom() * W;
            y = seededRandom() * H;
          } else {
            // 病害预警呈现聚集性爆发特征
            const targetCenters = centers.filter(c => c.type === cIdx);
            if (targetCenters.length > 0 && seededRandom() < 0.8) {
              const center = targetCenters[Math.floor(seededRandom() * targetCenters.length)];
              const radius = 30 + seededRandom() * 90;
              const angle = seededRandom() * Math.PI * 2;
              const dist = seededRandom() * radius;
              x = center.x + Math.cos(angle) * dist;
              y = center.y + Math.sin(angle) * dist;
            } else {
              x = seededRandom() * W;
              y = seededRandom() * H;
            }
          }

          x = Math.max(8, Math.min(W - 8, x));
          y = Math.max(8, Math.min(H - 8, y));

          // a. 病变预警点外围的辐射大光圈
          if (cIdx !== 0) {
            ctx.beginPath();
            ctx.arc(x, y, 6 + seededRandom() * 6, 0, Math.PI * 2);
            ctx.fillStyle = category.color;
            ctx.globalAlpha = 0.15;
            ctx.fill();
            ctx.globalAlpha = 1.0;
          }

          // b. 核心发光指示灯
          const r = (cIdx === 0) ? 2 : 2.5;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = category.color;
          ctx.shadowBlur = (cIdx === 0) ? 3 : 8; 
          ctx.shadowColor = category.color;
          ctx.fill();
          
          // c. 高亮白心，模拟 LED 质感
          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.arc(x, y, r * 0.4, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255,255,255,0.9)";
          ctx.fill();
        }
      });
    }

    // --- 初始化绑定 ---
    $("btnCreateInvite").addEventListener("click", createInvite);
    $("btnListInvites").addEventListener("click", () => { listInvites(); showToast("邀请码已刷新"); });
    $("btnListUsers").addEventListener("click", () => { listUsers(); showToast("用户列表已刷新"); });
    $("btnListPending").addEventListener("click", () => { listPending(); showToast("待审批列表已刷新"); });

    (async function initPage() {
      if (!(await validateAdmin())) {
        alert("无权限访问或登录已过期，请重新登录。");
        window.location.href = '/index.html';
        return;
      }
      await Promise.all([listInvites(), listUsers(), listPending()]);
      renderOrchardMap(); // 初始化果园分布图
    })();
  </script>
