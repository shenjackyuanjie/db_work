<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>开园团 | 橙管家</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/commerce.css" />
</head>

<body>
  <header class="app-header">
    <a class="app-brand" href="/commerce">
      <span class="app-brand__mark" aria-hidden="true">橙</span>
      <span class="app-brand__copy">
        <span class="app-brand__name">橙管家</span>
        <span class="app-brand__page">赣南脐橙开园团</span>
      </span>
    </a>
    <nav class="app-nav" aria-label="主导航">
      <a class="app-nav__link" href="/commerce" aria-current="page">开园团</a>
      <a class="app-nav__link" href="/analyze">病害识别</a>
      <a class="app-nav__link" href="/orchard-3d">3D 沙盘</a>
      <a class="app-nav__link" id="adminNavLink" href="/admin" hidden>管理后台</a>
      <span class="app-nav__divider" aria-hidden="true"></span>
      <span class="badge" id="loginBadge">未登录</span>
      <a class="app-nav__link" id="loginNavLink" href="/">登录 / 注册</a>
      <button class="app-nav__button app-nav__button--danger" id="logoutButton" type="button" hidden>退出登录</button>
    </nav>
  </header>

  <main class="commerce-shell">
    <section class="commerce-hero" aria-labelledby="pageTitle">
      <div>
        <div class="eyebrow">真实果园 · 限时预售 · 产地直发</div>
        <h1 id="pageTitle">这一箱脐橙，来自一个真实批次</h1>
        <p>开团后按订单组织采摘、分选和发货。每个批次都可以通过二维码查看产地与履约信息。</p>
      </div>
      <div class="hero-facts" aria-label="开团信息">
        <div><strong id="batchCount">--</strong><span>当前开团</span></div>
        <div><strong>产地直发</strong><span>赣南果园</span></div>
        <div><strong>批次可查</strong><span>扫码追溯</span></div>
      </div>
    </section>

    <div class="commerce-layout">
      <section class="commerce-main" aria-labelledby="batchTitle">
        <div class="section-heading">
          <div>
            <div class="eyebrow">OPEN ORCHARD GROUP</div>
            <h2 id="batchTitle">正在开团</h2>
          </div>
          <button class="app-nav__button" id="refreshButton" type="button">刷新</button>
        </div>
        <div class="message-bar" id="storefrontMessage" role="status">正在加载开团批次...</div>
        <div class="batch-list" id="batchList"></div>
      </section>

      <aside class="commerce-side">
        <section class="commerce-panel order-panel" aria-labelledby="orderTitle">
          <div class="section-heading section-heading--compact">
            <div>
              <div class="eyebrow">ORDER</div>
              <h2 id="orderTitle">提交预订</h2>
            </div>
            <span class="panel-status" id="orderStatus">未选择批次</span>
          </div>
          <div id="orderEmpty" class="empty-block">选择一个开团批次后，在这里填写收货信息。</div>
          <form id="orderForm" hidden>
            <div class="selected-batch" id="selectedBatchSummary"></div>
            <div class="form-grid">
              <label>收货人<input id="recipientName" name="recipient_name" required maxlength="40" /></label>
              <label>联系电话<input id="recipientPhone" name="recipient_phone" inputmode="tel" required maxlength="30" /></label>
            </div>
            <label>收货地址<textarea id="shippingAddress" name="shipping_address" required maxlength="240" rows="3"></textarea></label>
            <div class="order-items" id="orderItems"></div>
            <div class="order-total">
              <div><span>预计订单金额</span><strong id="orderTotal">¥0.00</strong></div>
              <small id="depositHint">下单后等待管理员确认收款</small>
            </div>
            <button class="app-nav__button app-nav__button--primary submit-button" id="submitOrderButton" type="submit">提交预订</button>
            <p class="form-note" id="loginNote" hidden>请先登录账户，再提交预订。</p>
          </form>
        </section>

        <section class="commerce-panel orders-panel" aria-labelledby="ordersTitle">
          <div class="section-heading section-heading--compact">
            <div>
              <div class="eyebrow">ACCOUNT</div>
              <h2 id="ordersTitle">我的订单</h2>
            </div>
            <button class="text-button" id="refreshOrdersButton" type="button" hidden>刷新</button>
          </div>
          <div class="empty-block" id="ordersEmpty">登录后可以查看订单状态。</div>
          <div class="orders-list" id="ordersList"></div>
        </section>
      </aside>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/commerce.js"></script>
</body>

</html>
