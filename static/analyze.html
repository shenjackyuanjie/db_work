<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>柑橘识别系统</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --card: #1f2937;
      --text: #f9fafb;
      --text-secondary: #9ca3af;
      --muted: #6b7280;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --border: #374151;
      --ring: rgba(59, 130, 246, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }

    /* 头部样式 */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
      color: var(--text);
    }

    header nav {
      margin-left: auto;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    header nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    header nav a:hover {
      color: var(--primary);
    }

    /* 主体布局 */
    main {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 20px 64px;
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 24px;
      align-items: start;
    }

    /* 卡片基础样式 */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    .card-header {
      margin-bottom: 20px;
    }

    .card-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    /* === 拖拽上传区域 (修复版) === */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      background: var(--bg);
      cursor: pointer;
      transition: all 0.2s;
      /* 核心修复：固定比例，防止高度塌陷挤压图片 */
      aspect-ratio: 16 / 10;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px;
      box-sizing: border-box;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.1);
    }

    /* 缺省文字容器 */
    .upload-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      color: var(--muted);
    }

    .upload-zone:hover .upload-icon {
      color: var(--primary);
    }

    .upload-text {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .upload-hint {
      font-size: 12px;
      color: var(--muted);
    }

    /* 预览图片样式 */
    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* 核心修复：保持图片原本比例，不拉伸剪裁 */
      border-radius: 8px;
      display: none;
      /* 默认隐藏 */
    }

    /* 当有图片时的状态控制 */
    .upload-zone.has-image {
      border-style: solid;
      /* 有图片时变成实线框更好看 */
      background: var(--card);
    }

    .upload-zone.has-image .upload-empty {
      display: none;
    }

    .upload-zone.has-image .preview-img {
      display: block;
    }

    /* 按钮组 */
    .action-group {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    button:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    button:disabled {
      background: var(--muted);
      cursor: not-allowed;
    }

    .btn-outline {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 13px;
    }

    .btn-outline:hover:not(:disabled) {
      background: var(--border);
      color: var(--text);
      box-shadow: none;
      transform: none;
    }

    /* 将页头的退出按钮突出为红色 pill 样式 */
    #logout-btn {
      background: var(--danger);
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    #logout-btn:hover {
      background: var(--danger);
      filter: brightness(0.95);
    }

    /* 提示框 */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    /* 徽章 */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--border);
      color: var(--text-secondary);
    }

    .badge.success {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
    }

    .badge.danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }

    .badge.warning {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warning);
    }

    .badge.primary {
      background: rgba(59, 130, 246, 0.1);
      color: var(--primary);
    }

    /* 结果展示区 */
    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .result-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-item.full-width {
      grid-column: 1 / -1;
    }

    .result-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .result-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      word-break: break-all;
    }

    /* 原始响应代码块 */

    .api-details {
      margin-top: 24px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      /* 核心修复：防止内容撑破父容器宽度 */
      min-width: 0;
      max-width: 100%;
    }

    .api-summary {
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 12px;
      transition: background 0.2s;
      /* 隐藏默认箭头，使用左侧自定义 Icon 更好看 */
      list-style: none;
    }

    .api-summary::-webkit-details-marker {
      display: none;
    }

    .api-summary:hover {
      background: var(--border);
      color: var(--text);
    }

    .api-details[open] .api-summary {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      border-bottom: 1px solid var(--border);
      background: var(--border);
    }

    .api-content {
      /* 核心修复：强行限制宽度，防止代码过长撑破卡片 */
      max-width: 100%;
      overflow: hidden;
    }

    .raw-response {
      background: #1e293b;
      color: #f8fafc;
      border-radius: 0 0 12px 12px;
      padding: 16px;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      line-height: 1.5;
      margin: 0;
      /* 核心修复：横向自动滚动，纵向限制最高 400px 并自动滚动 */
      overflow-x: auto;
      overflow-y: auto;
      max-height: 400px;
      /* 防止极长单行文本（如 Base64）导致的问题 */
      word-wrap: normal;
      white-space: pre;
    }

    /* 美化滚动条 */
    .raw-response::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .raw-response::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 0 0 12px 12px;
    }

    .raw-response::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }

    .raw-response::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    .hidden {
      display: none !important;
    }

    /* 加载动画 */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    button.loading .spinner {
      display: inline-block;
    }

    button.loading span {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* 进度条 */
    .progress-wrapper {
      margin-top: 16px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .progress-wrapper.show {
      display: flex;
    }

    .progress-container {
      width: 100%;
      height: 8px;
      background-color: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 1s linear;
    }

    .progress-text {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
    }

    /* 响应式 */
    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>柑橘识别系统</h1>
    <nav>
      <span class="badge" id="loginBadge">未登录</span>
      <button id="logout-btn" class="btn-outline hidden">退出登录</button>
      <div style="width: 1px; height: 16px; background: var(--border); margin: 0 8px;"></div>
      <a href="/index.html">登录/注册</a>
      <a href="/admin.html">管理员</a>
    </nav>
  </header>

  <main>
    <!-- 左侧：上传区域 -->
    <section class="card">
      <div class="card-header">
        <h2>图片上传</h2>
      </div>

      <input type="file" id="imageInput" accept="image/jpeg, image/png, image/gif, image/webp" hidden />

      <div class="upload-zone" id="uploadZone">
        <!-- 未上传时的缺省提示 -->
        <div class="upload-empty" id="uploadEmpty">
          <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
          <div class="upload-text">点击选择或拖拽图片到此处</div>
          <div class="upload-hint">支持 JPEG, PNG, WebP 格式</div>
        </div>
        <!-- 预览图片 -->
        <img id="previewImg" class="preview-img" src="" alt="预览" />
      </div>

      <div class="action-group">
        <button id="analyzeBtn" disabled>
          <div class="spinner"></div>
          <span>开始智能识别</span>
        </button>
        <div class="upload-hint" style="text-align: center;" id="loginHint">需要先登录后才能识别</div>
        
        <div class="progress-wrapper" id="progressWrapper">
          <div class="progress-text" id="progressText">正在识别，请稍候... (预计 60 秒)</div>
          <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>
      </div>

      <div class="alert alert-danger hidden" id="errorBox">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span id="errorText"></span>
      </div>
    </section>

    <!-- 右侧：结果区域 -->
    <section class="card">
      <div class="card-header">
        <h2>识别报告</h2>
      </div>

      <div class="result-grid">

        <div class="result-item">
          <span class="result-label">健康状态</span>
          <div class="result-value" id="isHealthy">-</div>
        </div>
        <div class="result-item">
          <span class="result-label">病害名称</span>
          <div class="result-value" id="diseaseName">-</div>
        </div>
        <div class="result-item">
          <span class="result-label">严重程度</span>
          <div class="result-value" id="severity">-</div>
        </div>
        <div class="result-item">
          <span class="result-label">置信度</span>
          <div class="result-value" id="confidence">-</div>
        </div>

        <div class="result-item full-width">
          <span class="result-label">治疗建议</span>
          <div class="result-value" id="treatment" style="font-size: 14px; font-weight: 400;">-</div>
        </div>
        <div class="result-item full-width">
          <span class="result-label">预防措施</span>
          <div class="result-value" id="prevention" style="font-size: 14px; font-weight: 400;">-</div>
        </div>

        <div class="result-item">
          <span class="result-label">图片质量告警</span>
          <div class="result-value" id="qualityWarning" style="color: var(--warning); font-size: 14px;">-</div>
        </div>
        <div class="result-item">
          <span class="result-label">性能指标</span>
          <div class="result-value" style="font-size: 14px; font-weight: 400;">
            耗时: <span id="duration">-</span> s<br>
            <span style="color:var(--muted); font-size: 12px;" id="tps">- token/s</span>
          </div>
        </div>
      </div>

      <details class="api-details">
        <summary class="api-summary">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
          </svg>
          查看 API 原始响应
        </summary>
        <div class="api-content">
          <pre class="raw-response" id="rawResponse">// 等待分析...</pre>
        </div>
      </details>
    </section>
  </main>

  <script>
    const SESSION_COOKIE = "session_token";

    // DOM Elements
    const uploadZone = document.getElementById("uploadZone");
    const imageInput = document.getElementById("imageInput");
    const previewImg = document.getElementById("previewImg");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const errorBox = document.getElementById("errorBox");
    const errorText = document.getElementById("errorText");
    const loginBadge = document.getElementById("loginBadge");
    const loginHint = document.getElementById("loginHint");
    const logoutBtn = document.getElementById("logout-btn");
    const progressWrapper = document.getElementById("progressWrapper");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");

    // Result Elements
    const els = {
      isHealthy: document.getElementById("isHealthy"),
      diseaseName: document.getElementById("diseaseName"),
      severity: document.getElementById("severity"),
      confidence: document.getElementById("confidence"),
      treatment: document.getElementById("treatment"),
      prevention: document.getElementById("prevention"),
      qualityWarning: document.getElementById("qualityWarning"),
      duration: document.getElementById("duration"),
      tps: document.getElementById("tps"),
      rawResponse: document.getElementById("rawResponse")
    };

    // Cookies Tools
    function getCookie(name) {
      const prefix = `${name}=`;
      const part = document.cookie.split(";").map(i => i.trim()).find(i => i.startsWith(prefix));
      return part ? decodeURIComponent(part.slice(prefix.length)) : "";
    }
    function getToken() { return getCookie(SESSION_COOKIE); }

    // UI States
    function updateLoginUI() {
      const token = getToken();
      if (token) {
        loginBadge.textContent = "已登录";
        loginBadge.className = "badge success";
        loginHint.classList.add("hidden");
        logoutBtn.classList.remove("hidden");
        analyzeBtn.disabled = !imageInput.files.length;
      } else {
        loginBadge.textContent = "未登录";
        loginBadge.className = "badge";
        loginHint.classList.remove("hidden");
        logoutBtn.classList.add("hidden");
        analyzeBtn.disabled = true;
      }
    }

    function setError(msg) {
      if (!msg) {
        errorBox.classList.add("hidden");
      } else {
        errorBox.classList.remove("hidden");
        errorText.textContent = msg;
      }
    }

    function setBadge(el, text, type = 'default') {
      el.innerHTML = `<span class="badge ${type}">${text}</span>`;
    }

    function resetResult() {
      Object.values(els).forEach(el => { if (el.tagName !== 'PRE') el.textContent = "-" });
      els.rawResponse.textContent = "// 等待分析...";
    }

    // Drag & Drop and File Selection Logic
    uploadZone.addEventListener("click", () => imageInput.click());

    uploadZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      uploadZone.classList.add("dragover");
    });

    uploadZone.addEventListener("dragleave", () => {
      uploadZone.classList.remove("dragover");
    });

    uploadZone.addEventListener("drop", (e) => {
      e.preventDefault();
      uploadZone.classList.remove("dragover");
      if (e.dataTransfer.files.length) {
        imageInput.files = e.dataTransfer.files;
        handleFileSelect();
      }
    });

    imageInput.addEventListener("change", handleFileSelect);


    function handleFileSelect() {
      setError("");
      resetResult();
      const file = imageInput.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        previewImg.onload = () => URL.revokeObjectURL(url);
        previewImg.src = url;
        // 新增逻辑：给外层容器加上 class，触发 CSS 显示图片
        uploadZone.classList.add("has-image");
      } else {
        // 清除逻辑
        previewImg.src = "";
        uploadZone.classList.remove("has-image");
      }
      updateLoginUI();
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("读取图片失败"));
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    // API Request
    analyzeBtn.addEventListener("click", async () => {
      setError("");
      resetResult();
      const token = getToken();
      if (!token) { return setError("未登录，请先登录"); }
      const file = imageInput.files[0];
      if (!file) { return setError("请先选择图片"); }

      analyzeBtn.disabled = true;
      analyzeBtn.classList.add("loading");

      progressWrapper.classList.add("show");
      progressBar.style.width = "0%";
      progressText.textContent = "正在识别，请稍候... (预计 60 秒)";
      
      let progress = 0;
      const totalTime = 60000; // 预计 1 分钟
      const intervalTime = 100;
      const step = (intervalTime / totalTime) * 100;
      
      const progressInterval = setInterval(() => {
        if (progress < 95) { // 最多走到 95%，等待接口返回
          progress += step;
          progressBar.style.width = `${progress}%`;
          const remaining = Math.max(0, Math.ceil((totalTime * (1 - progress / 100)) / 1000));
          progressText.textContent = `正在识别，请稍候... (预计剩余 ${remaining} 秒)`;
        }
      }, intervalTime);

      try {
        const imageDataUrl = await fileToDataUrl(file);
        const resp = await fetch("/api/citrus-disease-v2", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            "X-Session-Token": token,
          },
          body: JSON.stringify({ image: imageDataUrl }),
        });

        const data = await resp.json();
        els.rawResponse.textContent = JSON.stringify(data, null, 2);

        if (!resp.ok || data.code !== 200) {
          throw new Error(data.message || data.error || "识别失败");
        }

        // 解析结果
        const result = data.data || {};
        const predictedClass = result.predicted_class || "";
        const isHealthy = result.is_healthy === true || predictedClass === "健康果树";
        const isFruitTree = predictedClass !== "非果树";

        if (!isFruitTree) {
          setBadge(els.isHealthy, "非果树", "warning");
        } else {
          setBadge(els.isHealthy, isHealthy ? "健康" : "患病", isHealthy ? "success" : "danger");
        }

        els.diseaseName.textContent = result.disease_name || predictedClass || "无";
        els.severity.textContent = result.severity || (isFruitTree ? "-" : "无需分级");

        if (typeof result.confidence === "number") {
          els.confidence.textContent = `${result.confidence.toFixed(2)}%`;
        }

        els.treatment.textContent = result.treatment_suggestion || "暂无建议";
        els.prevention.textContent = result.preventive_measures || "暂无建议";
        els.qualityWarning.textContent = result.image_quality_warning || "无";

        els.duration.textContent = "-";
        els.tps.textContent = result.stage || "-";

        clearInterval(progressInterval);
        progressBar.style.width = "100%";
        progressText.textContent = "识别完成！";
        setTimeout(() => {
          progressWrapper.classList.remove("show");
        }, 1500);

      } catch (err) {
        clearInterval(progressInterval);
        progressWrapper.classList.remove("show");
        setError(err.message || "请求服务器失败，请检查网络或后端配置");
      } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.classList.remove("loading");
      }
    });

    // 初始化
    updateLoginUI();

    // 退出登录
    logoutBtn.addEventListener('click', () => {
      document.cookie = `${SESSION_COOKIE}=; path=/; max-age=0; samesite=lax`;
      setTimeout(() => location.reload(), 80);
    });
  </script>
</body>

</html>
