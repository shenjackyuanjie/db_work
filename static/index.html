<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 / 注册</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
  <div id="system-banner" class="system-banner" hidden></div>
  <button id="logout-btn" class="top-logout ghost" style="display:none">退出登录</button>
    <div class="container single-centered">
      <div class="card">
        <div class="tabs">
          <button id="tab-login" class="active">登录</button>
          <button id="tab-register">注册</button>
        </div>

        <section id="login-section" class="card-section active">
          <div class="field">
            <label>用户名</label>
            <input id="login-username" placeholder="请输入用户名" />
          </div>
          <div class="field">
            <label>密码</label>
            <div class="input-with-btn">
              <input id="login-password" type="password" placeholder="请输入密码" />
              <button type="button" class="pw-toggle" data-target="login-password" aria-label="显示密码"></button>
            </div>
          </div>
          <button id="login-btn">登录</button>
          <div class="mode-switch" id="mode-switch">
            <button id="enter-user-mode">进入用户模式</button>
            <button id="enter-admin-mode">进入管理员模式</button>
          </div>
          <div class="msg" id="login-msg"></div>
        </section>

        <section id="register-section" class="card-section">
          <div class="field">
            <label>用户名</label>
            <input id="register-username" placeholder="请输入用户名" />
          </div>
          <div class="field">
            <label>密码</label>
            <div class="input-with-btn">
              <input id="register-password" type="password" placeholder="请输入密码" />
              <button type="button" class="pw-toggle" data-target="register-password" aria-label="显示密码"></button>
            </div>
          </div>
          <div class="field">
            <label>申请身份</label>
            <select id="register-role">
              <option value="user">用户</option>
              <option value="admin">管理员</option>
            </select>
          </div>
          <details>
            <summary>邀请码（可选，点击展开）</summary>
            <div class="invite-body">
              <input id="register-code" placeholder="不填则进入审核队列" />
              <div class="small" style="margin-top: 8px">
                输入正确邀请码可直接注册，输入错误会提示并可改为提交审核申请。
              </div>
            </div>
          </details>
          <button id="register-btn">注册</button>
          <div class="msg" id="register-msg"></div>
        </section>
      </div>
    </div>

    <script>
      const SESSION_COOKIE = "session_token";
      const COOKIE_AGE = 30 * 24 * 60 * 60;

      const loginBtn = document.getElementById("login-btn");
      const modeSwitch = document.getElementById("mode-switch");
      const userModeBtn = document.getElementById("enter-user-mode");
      const adminModeBtn = document.getElementById("enter-admin-mode");
      const registerBtn = document.getElementById("register-btn");
      const loginMsg = document.getElementById("login-msg");
      const registerMsg = document.getElementById("register-msg");
      const systemBanner = document.getElementById("system-banner");
      let systemStatus = {
        open_registration: true,
        invite_bypass_enabled: true,
        maintenance_mode: false,
      };

      function unwrapApiPayload(payload) {
        if (payload && typeof payload === "object" && "data" in payload && payload.data != null) {
          return payload.data;
        }
        return payload || {};
      }

      function readApiMessage(payload, fallback) {
        return payload?.error || payload?.message || unwrapApiPayload(payload)?.error || fallback;
      }

      function normalizeUserPayload(payload) {
        const data = unwrapApiPayload(payload);
        return (data && data.user) ? data.user : data;
      }

      function setRegisterEnabled(enabled) {
        tabRegister.disabled = !enabled;
        sectionRegister.querySelectorAll("input, select, button").forEach((el) => {
          el.disabled = !enabled;
        });

        if (!enabled && sectionRegister.classList.contains("active")) {
          tabLogin.click();
        }

        setMsg(registerMsg, enabled ? "" : "当前已关闭新用户注册", enabled ? null : "error");
      }

      function applySystemStatus(status) {
        if (!status || typeof status !== "object") return;

        systemStatus = {
          ...systemStatus,
          ...status,
        };

        const notices = [];
        if (systemStatus.maintenance_mode) {
          notices.push("系统维护中，仅管理员可登录");
        }
        if (!systemStatus.open_registration) {
          notices.push("当前已关闭新用户注册");
        }

        if (notices.length > 0) {
          systemBanner.textContent = notices.join(" · ");
          systemBanner.hidden = false;
        } else {
          systemBanner.hidden = true;
          systemBanner.textContent = "";
        }

        const inviteHint = document.querySelector(".invite-body .small");
        if (inviteHint) {
          inviteHint.textContent = systemStatus.invite_bypass_enabled
            ? "输入正确邀请码可直接注册，输入错误会提示并可改为提交审核申请。"
            : "当前已关闭邀请码免审核功能，填写邀请码也会进入审批队列。";
        }

        setRegisterEnabled(Boolean(systemStatus.open_registration));

        if (systemStatus.maintenance_mode) {
          setMsg(loginMsg, "系统维护中，仅管理员可登录", "error");
        } else if (loginMsg.textContent === "系统维护中，仅管理员可登录") {
          setMsg(loginMsg, "", null);
        }
      }

      async function fetchSystemStatus() {
        try {
          const res = await fetch("/api/system-status", {
            method: "GET",
            credentials: "same-origin",
          });
          const payload = await res.json().catch(() => ({}));
          applySystemStatus(unwrapApiPayload(payload));
        } catch (e) {
          // 忽略状态获取失败，不阻断登录页渲染
        }
      }
      
      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      const sectionLogin = document.getElementById("login-section");
      const sectionRegister = document.getElementById("register-section");
      loginBtn.dataset.mode = "login";
      
      tabLogin.addEventListener("click", () => {
        tabLogin.classList.add("active");
        tabRegister.classList.remove("active");
        sectionLogin.classList.add("active");
        sectionRegister.classList.remove("active");
      });
      tabRegister.addEventListener("click", () => {
        tabRegister.classList.add("active");
        tabLogin.classList.remove("active");
        sectionRegister.classList.add("active");
        sectionLogin.classList.remove("active");
      });

      function setMsg(el, text, type) {
        el.textContent = text || "";
        el.classList.remove("error", "success");
        if (type) el.classList.add(type);
        if (el.id === "login-msg" || el.id === "register-msg") {
          el.style.display = text ? "block" : "none";
        }
      }

      function getCookie(name) {
        const prefix = `${name}=`;
        const part = document.cookie
          .split(";")
          .map((item) => item.trim())
          .find((item) => item.startsWith(prefix));
        if (!part) return "";
        return decodeURIComponent(part.slice(prefix.length));
      }

      function setSessionToken(token) {
        if (!token) return;
        document.cookie = `${SESSION_COOKIE}=${encodeURIComponent(
          token
        )}; path=/; max-age=${COOKIE_AGE}; samesite=lax`;
      }

      function hideAdminModeChooser() {
        modeSwitch.style.display = "none";
        loginBtn.style.display = "block";
      }

      function showAdminModeChooser() {
        loginBtn.style.display = "none";
        modeSwitch.style.display = "flex";
      }

      // 统一的登录后 UI 更新（兼容后端直接返回 user 或包装在 { user, ... } 的情况）
      function applyLoggedInState(userOrResp) {
        const user = normalizeUserPayload(userOrResp);
        
        tabRegister.style.display = 'none';
        tabLogin.textContent = '已登录';
        tabLogin.classList.add('active');
        sectionRegister.classList.remove('active');
        sectionLogin.classList.add('active');

        const logoutBtnEl = document.getElementById('logout-btn');
        if (logoutBtnEl) logoutBtnEl.style.display = 'block';

        if (user.is_admin) {
          loginBtn.dataset.mode = "login";
          loginBtn.disabled = false;
          setMsg(loginMsg, "已登录（管理员），请选择模式", "success");
          showAdminModeChooser();
        } else {
          hideAdminModeChooser();
          const name = user.username || user.name || '未知用户';
          if (systemStatus.maintenance_mode) {
            loginBtn.dataset.mode = "disabled";
            loginBtn.textContent = "系统维护中";
            loginBtn.disabled = true;
            setMsg(loginMsg, `已登录：${name}。当前系统维护中，普通用户访问已暂停`, "error");
          } else {
            loginBtn.dataset.mode = "enter-user";
            loginBtn.disabled = false;
            loginBtn.textContent = "进入用户模式";
            setMsg(loginMsg, `已登录：${name}`, "success");
          }
        }
      }

      userModeBtn.addEventListener("click", () => {
        window.location.href = "/analyze.html";
      });

      adminModeBtn.addEventListener("click", () => {
        window.location.href = "/admin.html";
      });

      loginBtn.addEventListener("click", async () => {
        if (loginBtn.dataset.mode === "enter-user") {
          window.location.href = "/analyze.html";
          return;
        }
        if (loginBtn.disabled) {
          return;
        }

        hideAdminModeChooser();
        setMsg(loginMsg, "登录中...");
        const username = document.getElementById("login-username").value.trim();
        const password = document.getElementById("login-password").value.trim();
        if (!username || !password) {
          setMsg(loginMsg, "用户名或密码不能为空", "error");
          return;
        }

        const res = await fetch("/user/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ username, password }),
        });

        const raw = await res.json().catch(() => ({}));
        const data = unwrapApiPayload(raw);
        if (!res.ok) {
          setMsg(loginMsg, readApiMessage(raw, "登录失败"), "error");
          return;
        }

        setSessionToken(data.token || raw.token);
        // 登录返回的是 token + is_admin，继续请求后端以获取用户名后再应用已登录状态
        try {
          const vres = await fetch("/user/validate", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
          });
          const vdata = await vres.json().catch(() => ({}));
          applySystemStatus(vdata);
          if (vres.ok && vdata.valid) {
            applyLoggedInState(vdata);
            return;
          }
        } catch (e) {
          // 若校验请求失败，仍回退为使用登录响应（可能缺少用户名）
        }

        // 最后回退：依然应用登录响应（一般不会到这里，因为 /user/validate 应返回用户名）
        applyLoggedInState(data);
        return;
      });

      registerBtn.addEventListener("click", async () => {
        if (!systemStatus.open_registration) {
          setMsg(registerMsg, "当前已关闭注册", "error");
          return;
        }

        setMsg(registerMsg, "注册中...");
        const username = document.getElementById("register-username").value.trim();
        const password = document.getElementById("register-password").value.trim();
        const requested_role = document.getElementById("register-role").value;
        const invitation_code = document
          .getElementById("register-code")
          .value.trim();

        if (!username || !password) {
          setMsg(registerMsg, "用户名、密码不能为空", "error");
          return;
        }

        const res = await fetch("/user/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            username,
            password,
            requested_role,
            invitation_code,
          }),
        });

        const raw = await res.json().catch(() => ({}));
        const data = unwrapApiPayload(raw);
        if (!res.ok) {
          const hint = data.hint ? `。${data.hint}` : "";
          setMsg(registerMsg, `${readApiMessage(raw, "注册失败")}${hint}`, "error");
          return;
        }

        if (res.status === 202 || raw.message === "pending_approval") {
          const roleText = requested_role === "admin" ? "管理员" : "用户";
          const hint = data.hint ? `，${data.hint}` : "";
          setMsg(registerMsg, `已提交${roleText}申请，等待管理员审核${hint}`, "success");
          return;
        }

        if (requested_role === "admin") {
          setMsg(registerMsg, "注册成功（管理员），请登录后选择模式", "success");
          return;
        }

        setMsg(registerMsg, "注册成功，请返回登录", "success");
      });

        // 页面加载时检查是否已有会话 cookie，若存在则向后端验证并显示已登录状态，隐藏注册栏
        async function checkSessionOnLoad() {
          const token = getCookie(SESSION_COOKIE);
          if (!token) return;
          setMsg(loginMsg, "检测到会话，验证中...");
          try {
            const res = await fetch("/user/validate", {
              method: "POST",
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
            });
            const data = await res.json().catch(() => ({}));
            applySystemStatus(data);
            if (res.ok && data.valid) {
              setSessionToken(token);
              applyLoggedInState(data);
              return;
            }

            // token 无效则清除 cookie，并恢复注册栏显示
            document.cookie = `${SESSION_COOKIE}=; path=/; max-age=0; samesite=lax`;
            tabRegister.style.display = 'block';
            tabLogin.textContent = '登录';
            loginBtn.dataset.mode = 'login';
            loginBtn.disabled = false;
            loginBtn.textContent = '登录';
            const logoutBtnEl = document.getElementById('logout-btn');
            if (logoutBtnEl) logoutBtnEl.style.display = 'none';
          } catch (e) {
            // 忽略网络错误，不影响页面其他功能
          }
        }

        // 立即执行检查
        (async function initPage() {
          await fetchSystemStatus();
          await checkSessionOnLoad();
        })();

        // 统一的 logout：清除 cookie 并刷新页面
        function logout() {
          document.cookie = `${SESSION_COOKIE}=; path=/; max-age=0; samesite=lax`;
          // 小延迟保证 cookie 写入后刷新
          setTimeout(() => location.reload(), 80);
        }

        // 绑定浮动退出按钮
        document.getElementById('logout-btn')?.addEventListener('click', logout);

      // 密码显示/隐藏切换逻辑（使用 SVG 图标）
      const eyeOpen = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="10" ry="6"></ellipse><circle cx="12" cy="12" r="3"></circle></svg>';
      const eyeClosed = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="10" ry="6"></ellipse><circle cx="12" cy="12" r="3"></circle><line x1="4" y1="4" x2="20" y2="20"></line></svg>';

      document.querySelectorAll('.pw-toggle').forEach(btn => {
        const targetId = btn.getAttribute('data-target');
        const input = document.getElementById(targetId);
        if (!input) return;

        function updateIcon() {
          const isPassword = input.type === 'password';
          btn.innerHTML = isPassword ? eyeOpen : eyeClosed;
          btn.title = isPassword ? '显示密码' : '隐藏密码';
          btn.setAttribute('aria-pressed', String(!isPassword));
        }

        btn.addEventListener('click', () => {
          input.type = input.type === 'password' ? 'text' : 'password';
          updateIcon();
        });

        // 初始化图标状态
        updateIcon();
      });

    </script>
  </body>
</html>
