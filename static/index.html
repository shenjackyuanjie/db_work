<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 / 注册</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --primary: #22c55e;
        --border: #1f2937;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .container {
        width: 100%;
        max-width: 920px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
      }
      h2 {
        margin: 0 0 16px;
      }
      .field {
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0b1220;
        color: var(--text);
        outline: none;
      }
      input:focus {
        border-color: #334155;
      }
      button {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 0;
        background: var(--primary);
        color: #0b1220;
        font-weight: 700;
        cursor: pointer;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      .tag {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 999px;
        background: #0b1220;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .msg {
        margin-top: 10px;
        font-size: 13px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #0b1220;
        border: 1px solid var(--border);
        color: var(--muted);
        min-height: 38px;
      }
      .msg.error {
        color: #fecaca;
        border-color: #7f1d1d;
      }
      .msg.success {
        color: #bbf7d0;
        border-color: #14532d;
      }
      .links {
        margin-top: 12px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      a {
        color: #93c5fd;
        text-decoration: none;
        font-size: 13px;
      }
      a:hover {
        text-decoration: underline;
      }
      .small {
        font-size: 12px;
        color: var(--muted);
        word-break: break-all;
      }
      @media (max-width: 900px) {
        .container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <section class="card">
        <h2>登录</h2>
        <div class="field">
          <label>用户名</label>
          <input id="login-username" placeholder="请输入用户名" />
        </div>
        <div class="field">
          <label>密码</label>
          <input id="login-password" type="password" placeholder="请输入密码" />
        </div>
        <button id="login-btn">登录</button>
        <div class="msg" id="login-msg"></div>
        <div class="links">
          <a href="/admin.html">管理员页面</a>
          <a href="/analyze.html">识别页面</a>
        </div>
        <div class="row">
          <span class="tag">token</span>
          <span class="small" id="token-preview">未登录</span>
        </div>
      </section>

      <section class="card">
        <h2>注册</h2>
        <div class="field">
          <label>用户名</label>
          <input id="register-username" placeholder="请输入用户名" />
        </div>
        <div class="field">
          <label>密码</label>
          <input id="register-password" type="password" placeholder="请输入密码" />
        </div>
        <div class="field">
          <label>邀请码（可选）</label>
          <input id="register-code" placeholder="可留空，需管理员审批" />
        </div>
        <button id="register-btn">注册</button>
        <div class="msg" id="register-msg"></div>
        <div class="small">无邀请码将进入待审批队列。</div>
      </section>
    </div>

    <script>
      const tokenKey = "glm_token";

      const loginBtn = document.getElementById("login-btn");
      const registerBtn = document.getElementById("register-btn");
      const loginMsg = document.getElementById("login-msg");
      const registerMsg = document.getElementById("register-msg");
      const tokenPreview = document.getElementById("token-preview");

      function setMsg(el, text, type) {
        el.textContent = text || "";
        el.classList.remove("error", "success");
        if (type) el.classList.add(type);
      }

      function setToken(token) {
        if (token) {
          localStorage.setItem(tokenKey, token);
        } else {
          localStorage.removeItem(tokenKey);
        }
        const current = localStorage.getItem(tokenKey);
        tokenPreview.textContent = current ? current : "未登录";
      }

      setToken(localStorage.getItem(tokenKey));

      loginBtn.addEventListener("click", async () => {
        setMsg(loginMsg, "登录中...");
        const username = document.getElementById("login-username").value.trim();
        const password = document.getElementById("login-password").value.trim();
        if (!username || !password) {
          setMsg(loginMsg, "用户名或密码不能为空", "error");
          return;
        }

        const res = await fetch("/user/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          setMsg(loginMsg, data.error || "登录失败", "error");
          return;
        }

        setToken(data.token);
        setMsg(
          loginMsg,
          data.is_admin ? "登录成功（管理员）" : "登录成功",
          "success"
        );
      });

      registerBtn.addEventListener("click", async () => {
        setMsg(registerMsg, "注册中...");
        const username = document.getElementById("register-username").value.trim();
        const password = document.getElementById("register-password").value.trim();
        const invitation_code = document
          .getElementById("register-code")
          .value.trim();
        if (!username || !password) {
          setMsg(registerMsg, "用户名、密码不能为空", "error");
          return;
        }

        const res = await fetch("/user/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, invitation_code }),
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          setMsg(registerMsg, data.error || "注册失败", "error");
          return;
        }

        if (data.status === "pending_approval") {
          setMsg(registerMsg, "已提交，等待管理员审批", "success");
          return;
        }

        setMsg(registerMsg, "注册成功，请返回登录", "success");
      });
    </script>
  </body>
</html>
