<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>账户 | 柑橘果园智能管理</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
  <div id="system-banner" class="system-banner" hidden></div>
  <button id="logout-btn" class="top-logout ghost" style="display:none">退出登录</button>
    <div class="container single-centered">
      <div class="card">
        <div class="auth-brand">
          <div class="app-brand__mark" aria-hidden="true">柑</div>
          <div>
            <div class="auth-brand__name">柑橘果园智能管理</div>
            <div class="auth-brand__page">账户登录与注册</div>
          </div>
        </div>
        <div class="tabs">
          <button id="tab-login" class="active">登录</button>
          <button id="tab-register">注册</button>
        </div>

        <section id="login-section" class="card-section active">
          <div class="field">
            <label>用户名</label>
            <input id="login-username" placeholder="请输入用户名" />
          </div>
          <div class="field">
            <label>密码</label>
            <div class="input-with-btn">
              <input id="login-password" type="password" placeholder="请输入密码" />
              <button type="button" class="pw-toggle" data-target="login-password" aria-label="显示密码"></button>
            </div>
          </div>
          <button id="login-btn">登录</button>
          <div class="mode-switch" id="mode-switch">
            <button id="enter-user-mode">进入用户模式</button>
            <button id="enter-admin-mode">进入管理员模式</button>
          </div>
          <div class="msg" id="login-msg"></div>
        </section>

        <section id="register-section" class="card-section">
          <div class="field">
            <label>用户名</label>
            <input id="register-username" placeholder="请输入用户名" />
          </div>
          <div class="field">
            <label>密码</label>
            <div class="input-with-btn">
              <input id="register-password" type="password" placeholder="请输入密码" />
              <button type="button" class="pw-toggle" data-target="register-password" aria-label="显示密码"></button>
            </div>
          </div>
          <div class="field">
            <label>申请身份</label>
            <select id="register-role">
              <option value="user">用户</option>
              <option value="admin">管理员</option>
            </select>
          </div>
          <details>
            <summary>邀请码（可选，点击展开）</summary>
            <div class="invite-body">
              <input id="register-code" placeholder="不填则进入审核队列" />
              <div class="small" style="margin-top: 8px">
                输入正确邀请码可直接注册，输入错误会提示并可改为提交审核申请。
              </div>
            </div>
          </details>
          <button id="register-btn">注册</button>
          <div class="msg" id="register-msg"></div>
        </section>
      </div>
    </div>

    <script src="/index.js"></script>
  </body>
</html>
